<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electron Snapora</title>
  </head>
  <body>
    <main id="app" aria-live="polite">
      <div class="capture-surface" data-state="waiting">
        <img class="screen-frame" alt="" draggable="false" />
        <canvas class="annotation-canvas" aria-label="Screenshot annotations"></canvas>
        <div class="screen-mask" aria-hidden="true"></div>
        <div class="selection" role="group" aria-label="Screenshot selection" hidden>
          <output class="size-hint" aria-live="off"></output>
          <span
            class="resize-handle handle-nw"
            data-handle="nw"
            aria-hidden="true"
          ></span>
          <span
            class="resize-handle handle-n"
            data-handle="n"
            aria-hidden="true"
          ></span>
          <span
            class="resize-handle handle-ne"
            data-handle="ne"
            aria-hidden="true"
          ></span>
          <span
            class="resize-handle handle-e"
            data-handle="e"
            aria-hidden="true"
          ></span>
          <span
            class="resize-handle handle-se"
            data-handle="se"
            aria-hidden="true"
          ></span>
          <span
            class="resize-handle handle-s"
            data-handle="s"
            aria-hidden="true"
          ></span>
          <span
            class="resize-handle handle-sw"
            data-handle="sw"
            aria-hidden="true"
          ></span>
          <span
            class="resize-handle handle-w"
            data-handle="w"
            aria-hidden="true"
          ></span>
        </div>
        <div class="window-snap-preview" aria-hidden="true" hidden></div>
        <div
          class="selection-toolbar"
          role="toolbar"
          aria-label="Screenshot actions"
          hidden
        >
          <div class="toolbar-panel selection-tool-panel">
            <button
              class="tool-button icon-button"
              type="button"
              data-tool="select"
              data-tooltip="Select"
              data-shortcut="V"
              aria-label="Select"
            >
              <svg class="toolbar-icon" aria-hidden="true">
                <use href="#icon-pointer"></use>
              </svg>
            </button>
          </div>
          <div
            class="toolbar-panel toolbar-group tool-group"
            aria-label="Annotation tools"
          >
            <button
              class="tool-button icon-button"
              type="button"
              data-tool="rectangle"
              data-tooltip="Rectangle"
              data-shortcut="R"
              aria-label="Rectangle"
            >
              <svg class="toolbar-icon" aria-hidden="true">
                <use href="#icon-rectangle"></use>
              </svg>
            </button>
            <button
              class="tool-button icon-button"
              type="button"
              data-tool="ellipse"
              data-tooltip="Ellipse"
              data-shortcut="O"
              aria-label="Ellipse"
            >
              <svg class="toolbar-icon" aria-hidden="true">
                <use href="#icon-ellipse"></use>
              </svg>
            </button>
            <button
              class="tool-button icon-button"
              type="button"
              data-tool="arrow"
              data-tooltip="Arrow"
              data-shortcut="A"
              aria-label="Arrow"
            >
              <svg class="toolbar-icon" aria-hidden="true">
                <use href="#icon-arrow"></use>
              </svg>
            </button>
            <button
              class="tool-button icon-button"
              type="button"
              data-tool="brush"
              data-tooltip="Brush"
              data-shortcut="P"
              aria-label="Brush"
            >
              <svg class="toolbar-icon" aria-hidden="true">
                <use href="#icon-brush"></use>
              </svg>
            </button>
            <button
              class="tool-button icon-button"
              type="button"
              data-tool="text"
              data-tooltip="Text"
              data-shortcut="T"
              aria-label="Text"
            >
              <svg class="toolbar-icon" aria-hidden="true">
                <use href="#icon-text"></use>
              </svg>
            </button>
            <button
              class="tool-button icon-button"
              type="button"
              data-tool="mosaic"
              data-tooltip="Mosaic"
              data-shortcut="M"
              aria-label="Mosaic"
            >
              <svg class="toolbar-icon icon-mosaic" aria-hidden="true">
                <use href="#icon-mosaic"></use>
              </svg>
            </button>
            <button
              class="tool-button icon-button"
              type="button"
              data-tool="watermark"
              data-tooltip="Watermark"
              data-shortcut="W"
              aria-label="Watermark"
            >
              <svg class="toolbar-icon" aria-hidden="true">
                <use href="#icon-watermark"></use>
              </svg>
            </button>
          </div>
          <div class="toolbar-panel toolbar-group settings-panel">
            <div class="toolbar-group history-group" aria-label="History">
              <button
                class="tool-button icon-button undo-button"
                type="button"
                data-tooltip="Undo"
                data-shortcut="Ctrl/⌘ Z"
                aria-label="Undo"
                disabled
              >
                <svg class="toolbar-icon" aria-hidden="true">
                  <use href="#icon-undo"></use>
                </svg>
              </button>
              <button
                class="tool-button icon-button redo-button"
                type="button"
                data-tooltip="Redo"
                data-shortcut="Ctrl/⌘ ⇧ Z"
                aria-label="Redo"
                disabled
              >
                <svg class="toolbar-icon" aria-hidden="true">
                  <use href="#icon-redo"></use>
                </svg>
              </button>
            </div>
          </div>
          <div
            class="toolbar-panel toolbar-group action-group"
            aria-label="Output actions"
          >
            <button
              class="toolbar-button icon-button pin-button"
              type="button"
              data-tooltip="Pin to screen"
              aria-label="Pin to screen"
            >
              <svg class="toolbar-icon" aria-hidden="true">
                <use href="#icon-pin"></use>
              </svg>
            </button>
            <button
              class="toolbar-button icon-button save-button"
              type="button"
              data-tooltip="Save"
              data-shortcut="Ctrl/⌘ S"
              aria-label="Save"
            >
              <svg class="toolbar-icon" aria-hidden="true">
                <use href="#icon-save"></use>
              </svg>
            </button>
            <button
              class="toolbar-button icon-button cancel-button"
              type="button"
              data-tooltip="Cancel"
              data-shortcut="Esc"
              aria-label="Cancel"
            >
              <svg class="toolbar-icon" aria-hidden="true">
                <use href="#icon-close"></use>
              </svg>
            </button>
            <button
              class="toolbar-button icon-button confirm-button"
              type="button"
              data-tooltip="Copy & Done"
              data-shortcut="Enter / Ctrl/⌘ C"
              aria-label="Copy & Done"
            >
              <svg class="toolbar-icon" aria-hidden="true">
                <use href="#icon-check"></use>
              </svg>
            </button>
          </div>
          <div
            class="toolbar-panel preset-panel"
            role="group"
            aria-label="Annotation style"
            hidden
          >
            <div class="preset-options stroke-options" role="group">
              <button
                class="preset-option-button line-width-preset"
                type="button"
                data-line-width="2"
                aria-label="Line width 2"
              >
                <span class="line-width-dot line-width-dot-small"></span>
              </button>
              <button
                class="preset-option-button line-width-preset"
                type="button"
                data-line-width="4"
                aria-label="Line width 4"
              >
                <span class="line-width-dot line-width-dot-medium"></span>
              </button>
              <button
                class="preset-option-button line-width-preset"
                type="button"
                data-line-width="8"
                aria-label="Line width 8"
              >
                <span class="line-width-dot line-width-dot-large"></span>
              </button>
            </div>
            <div class="preset-options text-options">
              <div class="text-style-presets" role="group">
                <button
                  class="preset-option-button text-style-preset text-style-default"
                  type="button"
                  data-text-style="default"
                  aria-label="Default"
                >
                  <span class="text-style-glyph">T</span>
                </button>
                <button
                  class="preset-option-button text-style-preset text-style-fill"
                  type="button"
                  data-text-style="fill"
                  aria-label="Fill"
                >
                  <span class="text-style-glyph">T</span>
                </button>
                <button
                  class="preset-option-button text-style-preset text-style-outline"
                  type="button"
                  data-text-style="outline"
                  aria-label="Outline"
                >
                  <span class="text-style-glyph">T</span>
                </button>
              </div>
              <label class="font-control">
                <span class="sr-only">Font size</span>
                <select class="font-size-select" aria-label="Font size">
                  <option value="16">16 px</option>
                  <option value="24" selected>24 px</option>
                  <option value="32">32 px</option>
                  <option value="48">48 px</option>
                </select>
              </label>
            </div>
            <div class="preset-options mosaic-options">
              <span class="mosaic-mode" aria-hidden="true">
                <svg class="toolbar-icon icon-mosaic">
                  <use href="#icon-mosaic"></use>
                </svg>
              </span>
              <span class="preset-divider" aria-hidden="true"></span>
              <label class="range-control mosaic-strength-control">
                <span class="range-label">Mosaic strength</span>
                <input
                  class="mosaic-strength-input"
                  type="range"
                  min="4"
                  max="32"
                  step="2"
                  value="8"
                />
                <output class="mosaic-strength-output">25%</output>
              </label>
            </div>
            <div class="preset-options watermark-options">
              <input
                class="watermark-text-input"
                type="text"
                maxlength="16"
                placeholder="Up to 16 characters"
                aria-label="Watermark"
              />
              <span class="preset-divider" aria-hidden="true"></span>
              <label class="range-control watermark-opacity-control">
                <span class="range-label">Opacity</span>
                <input
                  class="watermark-opacity-input"
                  type="range"
                  min="10"
                  max="100"
                  step="1"
                  value="28"
                />
                <output class="watermark-opacity-output">28%</output>
              </label>
            </div>
            <span class="preset-divider color-divider" aria-hidden="true"></span>
            <div class="color-palette" role="group" aria-label="Color">
              <button
                class="preset-color-button"
                type="button"
                data-color="#ff3b30"
                style="--preset-color: #ff3b30"
              ></button>
              <button
                class="preset-color-button"
                type="button"
                data-color="#ffcc00"
                style="--preset-color: #ffcc00"
              ></button>
              <button
                class="preset-color-button"
                type="button"
                data-color="#34c759"
                style="--preset-color: #34c759"
              ></button>
              <button
                class="preset-color-button"
                type="button"
                data-color="#0a84ff"
                style="--preset-color: #0a84ff"
              ></button>
              <button
                class="preset-color-button"
                type="button"
                data-color="#1c1c1e"
                style="--preset-color: #1c1c1e"
              ></button>
              <button
                class="preset-color-button"
                type="button"
                data-color="#8e8e93"
                style="--preset-color: #8e8e93"
              ></button>
              <button
                class="preset-color-button preset-color-light"
                type="button"
                data-color="#ffffff"
                style="--preset-color: #ffffff"
              ></button>
              <button
                class="color-control"
                type="button"
                data-tooltip="Custom color"
                aria-expanded="false"
              >
                <span class="sr-only">Custom color</span>
                <span class="custom-color-icon" aria-hidden="true">
                  <span class="color-check"></span>
                </span>
              </button>
            </div>
            <input class="color-input" type="hidden" value="#ff3b30" />
          </div>
        </div>
        <div
          class="color-picker-popover"
          role="dialog"
          aria-label="Custom color"
          hidden
        >
          <div
            class="color-picker-saturation"
            role="slider"
            tabindex="0"
            aria-label="Saturation and brightness"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <span class="color-picker-selector" aria-hidden="true"></span>
          </div>
          <input
            class="color-picker-hue"
            type="range"
            min="0"
            max="360"
            step="1"
            value="0"
            aria-label="Hue"
          />
        </div>
        <textarea
          class="text-editor"
          rows="1"
          wrap="soft"
          maxlength="500"
          aria-label="Annotation text"
          hidden
        ></textarea>
        <p class="status">Preparing screenshot…</p>
        <div class="copy-feedback" role="status" aria-live="polite" hidden>
          <span class="copy-feedback-icon" aria-hidden="true">
            <svg class="copy-feedback-check" viewBox="0 0 24 24">
              <path d="m4.8 12.4 4.2 4.2L19.2 6.4l-1.8-1.8L9 13l-2.4-2.4z"></path>
            </svg>
          </span>
          <span class="copy-feedback-text">Copied to clipboard</span>
        </div>
      </div>
    </main>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-pointer" viewBox="0 0 24 24">
        <path d="M5 3.8 18.5 14l-6.2 1.1-3.2 5.4L5 3.8Z" />
      </symbol>
      <symbol id="icon-rectangle" viewBox="0 0 24 24">
        <rect x="4.5" y="5" width="15" height="14" rx="1.5" />
      </symbol>
      <symbol id="icon-ellipse" viewBox="0 0 24 24">
        <ellipse cx="12" cy="12" rx="7.5" ry="7" />
      </symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24">
        <path d="m5 19 14-14M10 5h9v9" />
      </symbol>
      <symbol id="icon-brush" viewBox="0 0 24 24">
        <path d="m10.2 13.8 7.9-9.5a1.8 1.8 0 0 1 2.6 2.5l-9.5 8" />
        <path
          d="M10.2 13.8c-2.5-1.2-4.8.2-5.2 3.2-.2 1.6-1 2.5-2 3 4.2.7 7.3-.4 8.2-3.2.3-1 .1-2-.9-3Z"
        />
        <path d="m12.6 10.9 2.6 2.6" />
      </symbol>
      <symbol id="icon-text" viewBox="0 0 24 24">
        <path d="M5 7V4.5h14V7M12 4.5v15M8.5 19.5h7" />
      </symbol>
      <symbol id="icon-mosaic" viewBox="0 0 24 24">
        <rect x="4" y="4" width="6" height="6" rx="1" />
        <rect x="14" y="4" width="6" height="6" rx="1" />
        <rect x="4" y="14" width="6" height="6" rx="1" />
        <rect x="14" y="14" width="6" height="6" rx="1" />
      </symbol>
      <symbol id="icon-watermark" viewBox="0 0 24 24">
        <path d="M4 14 14 4M5 20 20 5M11 20l9-9" />
      </symbol>
      <symbol id="icon-undo" viewBox="0 0 24 24">
        <path d="m9 7-4 4 4 4M5 11h8.5a5.5 5.5 0 0 1 5.5 5.5" />
      </symbol>
      <symbol id="icon-redo" viewBox="0 0 24 24">
        <path d="m15 7 4 4-4 4M19 11h-8.5A5.5 5.5 0 0 0 5 16.5" />
      </symbol>
      <symbol id="icon-save" viewBox="0 0 24 24">
        <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 16v3h14v-3" />
      </symbol>
      <symbol id="icon-pin" viewBox="0 0 24 24">
        <path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6Z" />
        <path d="M12 14v7" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M18 6 6 18" />
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="m5 12.5 4.3 4.3L19 7" />
      </symbol>
    </svg>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
