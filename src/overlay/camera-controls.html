<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Snapora camera settings</title>
  </head>
  <body>
    <main>
      <div role="group" id="shapes">
        <button data-shape="rectangle">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="6" width="18" height="12" rx="2" />
          </svg>
        </button>
        <button data-shape="square">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="5" width="14" height="14" rx="2" />
          </svg>
        </button>
        <button data-shape="circle">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="7" />
          </svg>
        </button>
      </div>
      <div role="group" id="sizes">
        <button data-size="small">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
        <button data-size="medium">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="5" />
          </svg>
        </button>
        <button data-size="large">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="7" />
          </svg>
        </button>
      </div>
    </main>
    <script type="module" src="../recording/camera-controls.ts"></script>
  </body>
</html>
