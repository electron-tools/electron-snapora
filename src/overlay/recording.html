<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self'; media-src 'self' file: blob:; img-src 'self' file: blob:"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Snapora Recording</title>
  </head>
  <body>
    <main>
      <span id="dimensions" hidden></span>
      <section id="prepare">
        <div class="start-area">
          <button id="start" class="primary" disabled aria-busy="true">准备中…</button>
        </div>
        <div class="settings">
          <fieldset id="format">
            <legend id="format-label">选择格式</legend>
            <label><input type="radio" name="format" value="mp4" checked /> MP4</label>
            <label><input type="radio" name="format" value="gif" /> GIF</label>
          </fieldset>
          <div class="audio-controls" role="group" aria-label="Audio" id="audio">
            <button id="system" class="audio-toggle" aria-pressed="false">
              <span class="audio-icon" aria-hidden="true"
                ><svg viewBox="0 0 24 24">
                  <path d="M11 4 6 8H3v8h3l5 4V4Z" />
                  <path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" />
                  <path class="muted-slash" d="m3 2 19 20" /></svg
              ></span>
              <span class="audio-copy"
                ><span id="system-label"></span><span class="audio-state"></span
              ></span>
            </button>
            <div class="device-control">
              <button id="microphone" class="audio-toggle" aria-pressed="false">
                <span class="audio-icon" aria-hidden="true"
                  ><svg viewBox="0 0 24 24">
                    <rect x="9" y="2" width="6" height="13" rx="3" />
                    <path d="M5 10v2a7 7 0 0 0 14 0v-2m-7 9v3m-4 0h8" />
                    <path class="muted-slash" d="m3 2 19 20" /></svg
                ></span>
                <span class="audio-copy"
                  ><span id="microphone-label"></span><span class="audio-state"></span
                ></span></button
              ><button
                id="microphone-menu"
                class="device-arrow"
                aria-expanded="false"
                aria-controls="device-panel"
              >
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path d="m4 6 4 4 4-4" />
                </svg>
              </button>
            </div>
            <div class="device-control">
              <button id="camera" class="audio-toggle" aria-pressed="false">
                <span class="audio-icon" aria-hidden="true"
                  ><svg viewBox="0 0 24 24">
                    <rect x="2" y="5" width="14" height="14" rx="2" />
                    <path d="m16 10 6-4v12l-6-4" />
                    <path class="muted-slash" d="m3 2 19 20" /></svg
                ></span>
                <span class="audio-copy" id="camera-label"></span></button
              ><button
                id="camera-menu"
                class="device-arrow"
                aria-expanded="false"
                aria-controls="device-panel"
              >
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path d="m4 6 4 4 4-4" />
                </svg>
              </button>
            </div>
          </div>
          <section id="device-panel" hidden>
            <div class="device-heading">
              <span id="device-title"></span><button id="device-close">×</button>
            </div>
            <select id="device-list" size="4"></select>
          </section>
        </div>
      </section>
      <section id="active" hidden>
        <button id="bar-grip" aria-label="Move recording controls">
          <svg viewBox="0 0 12 18" aria-hidden="true">
            <circle cx="3" cy="4" r="1.3" />
            <circle cx="9" cy="4" r="1.3" />
            <circle cx="3" cy="9" r="1.3" />
            <circle cx="9" cy="9" r="1.3" />
            <circle cx="3" cy="14" r="1.3" />
            <circle cx="9" cy="14" r="1.3" />
          </svg>
        </button>
        <div class="timer-row">
          <span class="record-dot" aria-hidden="true"></span
          ><output id="timer">00:00</output><span id="limit"></span
          ><span id="record-state" class="sr-only"></span>
        </div>
        <div class="actions">
          <button id="pause">暂停</button
          ><button id="stop" class="danger">停止录制</button>
        </div>
      </section>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="../recording/renderer.ts"></script>
  </body>
</html>
